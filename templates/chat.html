<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!DOCTYPE html>
<html>

<head>
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
        integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}" />

    <!-- Initial chat history embedded as JSON (Jinja renders this) -->
    <script id="initial-history" type="application/json">
        {{ chat_history | tojson | safe }}
    </script>
</head>

<body>
    <!-- Background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">

                    <!-- Header with bot info + buttons -->
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight w-100">

                            <!-- Bot Avatar -->
                            <div class="img_cont">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    class="rounded-circle user_img">
                                <span class="online_icon"></span>
                            </div>

                            <!-- Bot Info -->
                            <div class="user_info">
                                <span>Medical Chatbot</span>
                                <p>Ask me anything!</p>
                            </div>

                            <!-- Buttons: Save, Saved Chats, Clear -->
                            <div class="ml-auto d-flex align-items-center">
                                <button id="save-chat" type="button" class="btn btn-sm btn-outline-light mr-2">
                                    Save Chat
                                </button>
                                <button id="view-saved-chats" type="button" class="btn btn-sm btn-outline-light mr-2">
                                    Saved Chats
                                </button>
                                <button id="clear-chat" type="button" class="btn btn-sm btn-outline-light">
                                    Clear Chat
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Chat messages -->
                    <div id="messageFormeight" class="card-body msg_card_body"></div>

                    <!-- Input area -->
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            <input type="text" id="text" name="msg" placeholder="Type your message..."
                                autocomplete="off" class="form-control type_msg" required />
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn">
                                    <i class="fas fa-location-arrow"></i>
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Read initial history from the JSON script tag
        let initialHistory = [];
        try {
            const el = document.getElementById("initial-history");
            if (el && el.textContent.trim()) {
                initialHistory = JSON.parse(el.textContent);
            }
        } catch (e) {
            initialHistory = [];
        }

        function renderMessage(role, text, time) {
            if (role === "user") {
                const userHtml = `
                <div class="d-flex justify-content-end mb-4">
                    <div class="msg_cotainer_send">
                        ${text}
                        <span class="msg_time_send">${time}</span>
                    </div>
                    <div class="img_cont_msg">
                        <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg">
                    </div>
                </div>`;
                $("#messageFormeight").append(userHtml);
            } else {
                const botHtml = `
                <div class="d-flex justify-content-start mb-4">
                    <div class="img_cont_msg">
                        <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg">
                    </div>
                    <div class="msg_cotainer">
                        ${marked.parse(text)}
                        <span class="msg_time">${time}</span>
                    </div>
                </div>`;
                $("#messageFormeight").append(botHtml);
            }
        }

        $(document).ready(function () {
            // ---- Render existing history (e.g., from loaded saved chat) ----
            if (Array.isArray(initialHistory) && initialHistory.length > 0) {
                initialHistory.forEach(function (turn) {
                    const role = turn[0];
                    const text = turn[1];
                    const time = ""; // no timestamp for historical load
                    renderMessage(role, text, time);
                });
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
            }

            /* ------------ SEND MESSAGE ------------ */
            $("#messageArea").on("submit", function (event) {
                event.preventDefault();

                const date = new Date();
                const str_time =
                    date.getHours() + ":" + (date.getMinutes() < 10 ? "0" : "") + date.getMinutes();
                const rawText = $("#text").val();

                // User bubble
                renderMessage("user", rawText, str_time);

                $("#text").val("");
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

                // Typing indicator
                const typingHtml = `
                <div class="d-flex justify-content-start mb-4 typing-wrapper">
                    <div class="img_cont_msg">
                        <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg">
                    </div>
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>`;

                $("#messageFormeight").append(typingHtml);
                $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

                // Send to backend
                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get",
                }).done(function (data) {
                    // Remove typing indicator
                    $(".typing-wrapper").remove();

                    const date2 = new Date();
                    const str_time2 =
                        date2.getHours() + ":" + (date2.getMinutes() < 10 ? "0" : "") + date2.getMinutes();

                    // Bot bubble
                    renderMessage("bot", data, str_time2);

                    $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
                });
            });

            /* ------------ SAVE CHAT (prompt for name, then clear UI) ------------ */
            $("#save-chat").on("click", function () {
                const chatName = prompt("Enter a name for this chat (optional):");
                if (chatName === null) {
                    return; // user cancelled
                }

                $.ajax({
                    type: "POST",
                    url: "/save_chat",
                    contentType: "application/json",
                    data: JSON.stringify({ name: chatName })
                }).done(function (res) {
                    if (res.status === "ok") {
                        alert("Chat saved as: " + res.name);
                        // Clear UI too, so user sees a fresh chat
                        $("#messageFormeight").empty();
                    } else {
                        alert(res.message || "No chat history to save yet.");
                    }
                });
            });

            /* ------------ VIEW SAVED CHATS ------------ */
            $("#view-saved-chats").on("click", function () {
                window.location.href = "/saved_chats";
            });

            /* ------------ CLEAR CHAT ------------ */
            $("#clear-chat").on("click", function () {
                $.ajax({
                    type: "POST",
                    url: "/clear"
                }).done(function () {
                    $("#messageFormeight").empty();
                });
            });

        });
    </script>

</body>

</html>
